<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up Form</title>
</head>
<body>
    <div class="logo-content">
        <img src="Img/odin-lined.png" alt="Logo">
        <p>ODIN</p>
    </div>
    <div class="right-content">
        <div class="main-content">
            <div class="header-text">
            This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. <br />
            Sign up now to get started.
            <p>You <em>know</em> you want to.</p>
        </div>
        <div class="form">
            <h4>Let's do this!</h4>
            <form>
                <label for="first-name">First Name</label>
                <input type="text" id="first-name">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name">
                <label for="email">Email</label>
                <input type="email" id="email">
                <label for="phone">Phone Number</label>
                <input type="number" id="phone">
                <label for="password">Password</label>
                <input type="password" id="password">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password">
            </form>
        </div>
        <div class="validate">
            <button class="btn_validate">Create Account</button>
            <div class="already-account">Already have an account? <a href="#">Log in</a></div>
        </div>
    </div>
</body>
</html>
